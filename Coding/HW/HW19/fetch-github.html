<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Repos Viewer</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            text-align: center;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        #output {
            margin-top: 30px;
            text-align: left;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            white-space: pre-wrap;
            border: 1px solid #ccc;
            padding: 15px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h1>🔍 GitHub Repo Fetcher</h1>

<input type="text" id="githubUser" placeholder="Enter GitHub username" />
<button onclick="fetchGitHubRepos()">Fetch Repos</button>

<div id="output"></div>

<script>
    async function fetchGitHubRepos() {
        const username = document.getElementById('githubUser').value.trim();
        const output = document.getElementById('output');

        if (!username) {
            output.textContent = "❗Please enter a GitHub username.";
            return;
        }

        output.textContent = "Loading...";

        try {
            const response = await fetch(`https://api.github.com/users/${username}/repos`);
            if (!response.ok) {
                throw new Error(`❌ User not found or API error (status ${response.status})`);
            }
            const repos = await response.json();

            // Optional: show only repo names
            if (repos.length === 0) {
                output.textContent = "ℹ️ This user has no public repositories.";
            } else {
                const names = repos.map(repo => `📁 ${repo.name}`).join('\n');
                output.textContent = names;
            }

        } catch (error) {
            output.textContent = error.message;
        }
    }

    // Optional: Support Enter key
    document.getElementById('githubUser').addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            fetchGitHubRepos();
        }
    });
</script>

</body>
</html>
