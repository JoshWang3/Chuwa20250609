<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucky Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            text-align: center;
        }

        input, button {
            font-size: 16px;
            padding: 10px;
            margin: 10px;
        }

        #result {
            font-size: 24px;
            margin-top: 30px;
            color: green;
        }
    </style>
</head>
<body>

<h1>🎯 Lucky Number Generator</h1>

<input type="text" id="nameInput" placeholder="Enter your name" />
<button onclick="generateLuckyNumber()">Get Lucky Number</button>

<div id="result"></div>

<script>
    function generateLuckyNumber() {
        const name = document.getElementById('nameInput').value.trim();
        const now = new Date();
        const seed = name + now.toISOString();  // combine name + current timestamp

        let hash = 0;
        for (let i = 0; i < seed.length; i++) {
            hash = seed.charCodeAt(i) + ((hash << 5) - hash);
        }

        // Make the number between 1 and 100
        const luckyNumber = Math.abs(hash % 100) + 1;

        document.getElementById('result').textContent = `🌟 Your lucky number is: ${luckyNumber}`;
    }

    // Support pressing Enter key
    document.getElementById('nameInput').addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            generateLuckyNumber();
        }
    });
</script>

</body>
</html>
