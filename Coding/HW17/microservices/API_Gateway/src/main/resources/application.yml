server:
  port: 8083

spring:
  application:
    name: API_GATEWAY

  cloud:
    gateway:
      routes:
        - id: CITIZEN-SERVICE
          uri:
            lb://CITIZEN-SERVICE
          predicates:
            - Path=/citizen/**

        - id: VACCINATION-CENTER
          uri:
            lb://VACCINATION-CENTER
          predicates:
            - Path=/vaccinationcenter/**

        - id: AGENT-SERVICE
          uri:
            lb://AGENT-SERVICE
          predicates:
            - Path=/agent/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
