<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GitHub Repos JSON Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    input[type="text"] { padding: .6rem .8rem; min-width: 260px; }
    button { padding: .6rem 1rem; cursor: pointer; }
    .hint { color: #555; margin-top: .5rem; }
    .status { margin: 1rem 0; font-weight: 600; }
    .error { color: #b00020; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 8px; overflow: auto; max-height: 60vh; }
    .small { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <h1>GitHub Repos (JSON)</h1>
  <div class="row">
    <label for="userInput">GitHub user:</label>
    <input id="userInput" type="text" placeholder="e.g. torvalds" />
    <button id="submitBtn">Submit</button>
  </div>

  <div id="status" class="status"></div>
  <pre id="output" aria-live="polite"></pre>

  <script>
    const input = document.getElementById('userInput');
    const button = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const output = document.getElementById('output');

    button.addEventListener('click', fetchRepos);

    async function fetchRepos() {
      const user = input.value.trim();
      clearMessages();

      if (!user) {
        showError('Please enter a GitHub username to continue.');
        return;
      }

      const url = `https://api.github.com/users/${encodeURIComponent(user)}/repos?per_page=100&sort=updated`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s

      setStatus(`Looking up repos for “${user}”...`);

      try {
        const res = await fetch(url, {
          headers: {
            'Accept': 'application/vnd.github+json'
          },
          signal: controller.signal,
        });

        if (!res.ok) {
          let message = 'Something went wrong.';
          if (res.status === 404) {
            message = `User “${user}” wasn’t found. Check the spelling and try again.`;
          } else if (res.status === 403) {
            message = 'Request was denied (possibly rate-limited). Please wait a minute and try again, or sign in on GitHub and use a token in a real app.';
          } else if (res.status === 500) {
            message = 'GitHub is having a moment. Try again shortly.';
          } else {
            message = `Request failed with status ${res.status}.`;
          }
          // Try to include GitHub’s error payload if present
          let details = '';
          try {
            const errJson = await res.json();
            if (errJson && errJson.message) details = ` Details: ${errJson.message}`;
          } catch {}
          throw new Error(message + details);
        }

        const data = await res.json();

        if (Array.isArray(data) && data.length === 0) {
          setStatus(`No public repositories found for “${user}”.`);
          output.textContent = '[]';
          return;
        }

        setStatus(`Found ${data.length} repos for “${user}”.`);
        // Show pretty JSON
        output.textContent = JSON.stringify(data, null, 2);

      } catch (err) {
        if (err.name === 'AbortError') {
          showError('The request took too long and was cancelled. Please check your connection and try again.');
        } else {
          showError(err.message || 'Unexpected error. Please try again.');
        }
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function setStatus(msg) {
      statusEl.classList.remove('error');
      statusEl.textContent = msg;
    }

    function showError(msg) {
      statusEl.classList.add('error');
      statusEl.textContent = msg;
      output.textContent = '';
    }

    function clearMessages() {
      statusEl.classList.remove('error');
      statusEl.textContent = '';
      output.textContent = '';
    }
  </script>
</body>
</html>
