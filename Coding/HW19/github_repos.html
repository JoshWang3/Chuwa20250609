<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Repo Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background: #f5f7fa;
      text-align: center;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }
    #output {
      margin-top: 30px;
      white-space: pre-wrap;
      text-align: left;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      background: #fff;
      padding: 20px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h1>🔍 GitHub Repository Finder</h1>

  <input type="text" id="githubUser" placeholder="Enter GitHub username" />
  <button onclick="fetchWithAsync()">Fetch Repos (async/await)</button>
  <button onclick="fetchWithThen()">Fetch Repos (.then/.catch)</button>

  <div id="output"></div>

  <script>
    const output = document.getElementById("output");

    // Approach 1: Async/Await
    async function fetchWithAsync() {
      const user = document.getElementById("githubUser").value.trim();
      output.textContent = "Loading...";

      try {
        if (!user) throw new Error("Please enter a GitHub username.");
        const response = await fetch(`https://api.github.com/users/${user}/repos`);
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("User not found. Please check the username.");
          } else {
            throw new Error(`Error ${response.status}: Unable to fetch repos.`);
          }
        }
        const repos = await response.json();
        output.textContent = JSON.stringify(repos, null, 2);
      } catch (err) {
        output.textContent = `⚠️ ${err.message}`;
      }
    }

    // Approach 2: .then().catch()
    function fetchWithThen() {
      const user = document.getElementById("githubUser").value.trim();
      output.textContent = "Loading...";

      if (!user) {
        output.textContent = "⚠️ Please enter a GitHub username.";
        return;
      }

      fetch(`https://api.github.com/users/${user}/repos`)
        .then(response => {
          if (!response.ok) {
            if (response.status === 404) {
              throw new Error("User not found. Please check the username.");
            } else {
              throw new Error(`Error ${response.status}: Unable to fetch repos.`);
            }
          }
          return response.json();
        })
        .then(data => {
          output.textContent = JSON.stringify(data, null, 2);
        })
        .catch(error => {
          output.textContent = `⚠️ ${error.message}`;
        });
    }

    // Optional: Trigger fetch on Enter key
    document.getElementById("githubUser").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        fetchWithAsync(); // Default to async/await version
      }
    });
  </script>

</body>
</html>
