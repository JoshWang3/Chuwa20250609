<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucky Number Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: linear-gradient(to right, #f9f9f9, #e6f7ff);
        }
        input, button {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
        }
        #result {
            margin-top: 30px;
            font-size: 24px;
            color: #0077cc;
        }
    </style>
</head>
<body>

    <h1>🔮 Lucky Number Generator 🔢</h1>

    <input type="text" id="userInput" placeholder="Enter your name or keyword" />
    <button onclick="generateLuckyNumber()">Get Lucky Number</button>

    <div id="result"></div>

    <script>
        function generateLuckyNumber() {
            const input = document.getElementById("userInput").value.trim();
            if (input === "") {
                document.getElementById("result").textContent = "Please enter something!";
                return;
            }

            const now = new Date();
            const seed = input + now.toISOString();
            let hash = 0;
            for (let i = 0; i < seed.length; i++) {
                hash = seed.charCodeAt(i) + ((hash << 5) - hash);
                hash = hash & hash; // Convert to 32bit integer
            }

            const luckyNumber = Math.abs(hash % 100) + 1; // 1 to 100
            document.getElementById("result").textContent = `Your lucky number is: 🎉 ${luckyNumber}`;
        }

        document.getElementById("userInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                generateLuckyNumber();
            }
        });
    </script>

</body>
</html>
