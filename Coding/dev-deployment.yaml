apiVersion: apps/v1
kind: Deployment
metadata:
  name: redbook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redbook
  template:
    metadata:
      labels:
        app: redbook
    spec:
      containers:
        - name: redbook
          image: springboot-redbook-app:dev   # use correct local image tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://redbook-mysql:3306/redbook?useSSL=false&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""

---
apiVersion: v1
kind: Service
metadata:
  name: redbook-service
spec:
  type: NodePort
  selector:
    app: redbook
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
