apiVersion: apps/v1
kind: Deployment
metadata:
  name: redbook-mysql
spec:
  selector:
    matchLabels:
      app: redbook-mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: redbook-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_DATABASE
              value: redbook
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
          ports:
            - containerPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: redbook-mysql
spec:
  selector:
    app: redbook-mysql
  ports:
    - port: 3306
      targetPort: 3306