# Application Configuration
spring.application.name=Spring-Producer-Consumer
server.port=8081

# Database Configuration (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/kafka-demo
spring.datasource.username=postgres
spring.datasource.password=YANGao_2000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration - Multi-Broker Setup
spring.kafka.bootstrap-servers=localhost:9091,localhost:9092,localhost:9093
spring.kafka.consumer.group-id=consumer_group_1
spring.kafka.consumer.group-id-at-most-once=consumer_group_1-at-most-once
kafka.topic.name=chuwa-yyds

# Disable auto topic creation
spring.kafka.admin.auto-create=false

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer Configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.isolation.level=read_committed

# Logging
logging.level.com.chuwa.demo=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN