<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GitHub Repos Fetcher</title>
</head>
<body>
  <h2>GitHub Repositories</h2>
  <input id="username" placeholder="Enter GitHub username">
  <button id="btn">Get Repos</button>
  <pre id="result"></pre>

  <script>
    async function fetchRepos() {
      const user = document.getElementById('username').value.trim();
      const result = document.getElementById('result');
      result.textContent = "Loading...";

      if (!user) {
        result.textContent = "Please enter a username.";
        return;
      }

      try {
        const response = await fetch(`https://api.github.com/users/${user}/repos`);
        if (!response.ok) {
          throw new Error(`Error: ${response.status} - ${response.statusText}`);
        }
        const repos = await response.json();
        result.textContent = JSON.stringify(repos, null, 2);
      } catch (err) {
        result.textContent = `Failed to fetch repos: ${err.message}`;
      }
    }

    document.getElementById('btn').onclick = fetchRepos;
    document.getElementById('username').addEventListener('keypress', e => {
      if (e.key === 'Enter') fetchRepos();
    });
  </script>
</body>
</html>
