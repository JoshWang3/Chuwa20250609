<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>GitHub Repos Fetcher</title>
    </head>
    <body>
        <h2>GitHub Repo Fetcher</h2>

        <label for="username">GitHub User ID:</label>
        <input type="text" id="username" />
        <button onclick="fetchReposAsyncAwait()">Fetch</button>

        <pre id="result" style="background:#f0f0f0; padding:10px;"></pre>

        <script>
            const resultEl = document.getElementById('result');

            // async/await
            async function fetchReposAsyncAwait() {
                const user = document.getElementById("username").value.trim();
                if (!user) {
                    resultEl.textContent = "Please enter a GitHub user ID.";
                    return;
                }

                try {
                    const response = await fetch(`https://api.github.com/users/${user}/repos`);
                    if (!response.ok) {
                        throw new Error(`User not found or API error (status ${response.status})`);
                    }
                    const data = await response.json();
                    resultEl.textContent = JSON.stringify(data, null, 2);
                } catch (err) {
                    resultEl.textContent = `Error: ${err.message}`;
                }
            }
        </script>
    </body>
</html>
