<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>GitHub Repos (JSON)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: system-ui, Arial, sans-serif; margin: 20px; }
        .row { display: flex; gap: 8px; }
        input, button { padding: 8px 10px; font-size: 14px; }
        pre { background: #f6f8fa; padding: 10px; border: 1px solid #ddd; overflow: auto; }
        .status { margin: 10px 0; color: #555; }
        .error { color: #b00020; }
        .ok { color: #0f8a0f; }
    </style>
</head>
<body>
<h1>GitHub Repos → JSON</h1>
<form id="form" class="row" autocomplete="on">
    <input id="user" type="text" placeholder="GitHub user (e.g., torvalds)" required autofocus />
    <button type="submit">Fetch</button>
</form>

<div id="status" class="status"></div>
<pre id="output" aria-live="polite"></pre>

<script>
    const form = document.getElementById('form');
    const userEl = document.getElementById('user');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    function setStatus(msg, cls = '') {
        statusEl.textContent = msg;
        statusEl.className = 'status ' + cls;
    }

    function friendlyError(resp, bodyText) {
        const s = resp?.status;
        if (s === 404) return 'User not found. Please check the GitHub user ID.';
        if (s === 403 && /rate limit/i.test(bodyText || '')) return 'Rate limit hit. Try again later.';
        if (s) return `Request failed (HTTP ${s}). Please try again.`;
        return 'Network error. Check your connection and try again.';
    }

    async function fetchRepos(user) {
        const url = `https://api.github.com/users/${encodeURIComponent(user)}/repos`;
        const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
        const text = await res.text(); // read once
        let data = null;
        try { data = text ? JSON.parse(text) : []; } catch { /* ignore parse error */ }
        if (!res.ok) throw new Error(friendlyError(res, text));
        return data ?? [];
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = userEl.value.trim();
        if (!user) {
            setStatus('Please enter a GitHub user ID.', 'error');
            outputEl.textContent = '';
            return;
        }

        setStatus('Fetching…');
        outputEl.textContent = '';
        try {
            const repos = await fetchRepos(user);
            setStatus('Success', 'ok');
            outputEl.textContent = JSON.stringify(repos, null, 2);
        } catch (err) {
            setStatus(err.message || 'Something went wrong.', 'error');
            outputEl.textContent = '';
        }
    });
</script>
</body>
</html>
