<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Lucky Number Generator</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: white; padding: 20px 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 200px; }
        button { margin-top: 10px; padding: 10px 16px; border: none; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .result { margin-top: 15px; font-size: 1.5rem; font-weight: bold; color: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>Lucky Number 🔮</h1>
    <form id="lucky-form">
        <input type="text" id="name" placeholder="Enter your name" required autofocus />
        <br>
        <button type="submit">Get Lucky Number</button>
    </form>
    <div class="result" id="result"></div>
</div>

<script>
    function hashString(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) {
            h = (h << 5) - h + str.charCodeAt(i);
            h |= 0; // convert to 32bit int
        }
        return Math.abs(h);
    }

    document.getElementById("lucky-form").addEventListener("submit", function(e) {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const now = new Date();
        const seed = hashString(name + now.toDateString() + now.toTimeString());
        const luckyNumber = (seed % 99) + 1; // 1-99
        document.getElementById("result").textContent = `Your lucky number is: ${luckyNumber}`;
    });
</script>
</body>
</html>
